<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RSS媒体阅读器</title>
<script src="https://unpkg.com/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto;}
html {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  height: 100%;
  background: #e0e0e0;
}
body{
  background:#f5f5f5;color:#111;
  height: 100%;
  margin: 0 auto;
  max-width: 430px;
  position: relative;
}

/* 顶部悬浮固定栏 磨砂玻璃 */
#mainHeader{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    margin: 0 auto;
    max-width: 430px;
    width: 100%;
    height: 48px;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    z-index: 9999;
    display:flex;
    align-items:center;
    justify-content:center;
}

.title-wrap {
  position: relative;
  width: fit-content;
}
.beta-tag {
  position: absolute;
  top: -3px;
  right: -40px;
  font-size: 12px;
  background:#28a745;
  color:#fff;
  padding:2px 8px;
  border-radius:6px;
  z-index:9999;
  white-space:nowrap;
}
#pageTitle{
    font-size:19px;
    font-weight:600;
    white-space:nowrap;
}

/* 卡片样式 */
.tweet-card{
    background:#fff;
    border:none;
    border-radius:0;
    padding:14px;
    border-bottom:1px solid #dddddd;
    margin-bottom:0;
}

.img-grid-wrap{
    border-radius:10px;
    overflow:hidden;
    background:#f0f0f0;
    margin:6px 0;
}
.video-single-wrap{
    width:100%;
    position:relative;
    border-radius:10px;
    overflow:hidden;
    margin:6px 0;
    background:#000;
    height: auto;
}
.video-single-wrap:fullscreen{
    width:100vw;
    height:100vh;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
}
.video-single-wrap:-webkit-full-screen{
    width:100vw;
    height:100vh;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* 骨架屏微光：推文配图占位，消除布局抖动（CLS），观感更顺 */
.grid-img-box{
    background:#ededed;
    background-image:linear-gradient(100deg,#ededed 30%,#f6f6f6 50%,#ededed 70%);
    background-size:200% 100%;
    animation:vs-shimmer 1.4s linear infinite;
}
.grid-img{background:transparent;animation:none;}

@keyframes vs-shimmer{to{background-position:-200% 0;}}

/* 底部悬浮导航栏 磨砂玻璃 */
.bottom-nav-bar{
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    margin: 0 auto;
    max-width: 430px;
    width: 100%;
    height: 50px;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    z-index: 9999;
    display:flex;
    justify-content:space-around;
    overflow: hidden;
}
.bottom-nav-bar button{
    flex:1;
    height:100%;
    border:none;
    background:transparent;
    position: relative;
    /* 图标居中 */
    display:flex;
    align-items:center;
    justify-content:center;
}
/* 选中状态：图标变绿色 */
.bottom-nav-bar button.active svg{
    stroke:#28a745 !important;
}
/* 底部蓝色横线 */
.bottom-nav-bar button.active::after{
    content:"";
    position:absolute;
    left:15%;
    right:15%;
    bottom:0;
    height:4px;
    background:#0066dd;
    border-radius:4px;
}

.bottom-nav-bar::-webkit-scrollbar {
    display: none !important;
}

.main-wrap{
    padding-top: 48px;
    padding-bottom: 50px;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
}
.page-home,.page-manage,.page-add,.page-fav,.page-search,.page-single{display:none;}
#pageHome,#pageManage,#pageFav,#pageSearch{
    width: 100%;
}
#pageAdd{
    width: 100%;
}

.feed-top-op{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin:12px 0;
}
#importFeed{background:#ff7823;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:14px;}
#exportAllBtn{background:#b388eb;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:14px;}
#delAllFeed{background:#c0392b;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:14px;}
.feed-list{background:#fff;}
.feed-item{
    padding:12px 10px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}
.feed-item:last-child{border-bottom:none;}

.feed-left-area{
    display:flex;
    align-items:flex-start;
    gap:8px;
    flex:1;
    min-width:0;
}
.feed-index{
    width:24px;
    text-align:center;
    font-size:14px;
    color:#666;
    flex-shrink:0;
    line-height:24px;
}
.feed-name-block{
    flex:1;
    min-width:0;
}
.feed-title-text{
    font-size:15px;
    font-weight:700;
    font-family:"SimSun","宋体","Songti SC","Noto Serif CJK SC",serif;
    color:#111;
    word-break:break-all;
    line-height:1.4;
}
.feed-update-time{
    font-size:12px;
    color:#999;
    margin-top:4px;
    line-height:1.2;
}
.feed-unread-badge-inline{
    display:inline-block;
    min-width:16px;
    height:16px;
    line-height:16px;
    padding:0 4px;
    background:#ff3b30;
    color:#fff;
    font-size:11px;
    font-weight:600;
    border-radius:8px;
    text-align:center;
    box-sizing:border-box;
    margin-right:6px;
    vertical-align:middle;
}

.feed-btn-group{
    display:flex;
    gap:4px;
    flex-shrink:0;
}
.feed-btn-group button{
    border:none;
    padding:6px;
    border-radius:6px;
    font-size:13px;
    color:#333;
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}
.feed-btn-group button svg{width:18px;height:18px;stroke:currentColor;}
.feed-btn-group button:hover{color:#000;background:#f0f0f0;}

.add-feed-row{display:flex;flex-wrap:wrap;gap:10px;margin:15px 12px;}
.add-feed-row input{
    flex:1;
    min-width:140px;
    padding:8px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}
.add-feed-row button{
    background:#1d9bf0;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:15px;min-width:70px;flex-shrink:0;cursor:pointer;
}
#addKeywordBtn{background:#1d9bf0;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:15px;min-width:70px;flex-shrink:0;cursor:pointer;}
.twitter-block-section{
    border-top:2px solid #4CAF50;
    margin:20px 12px 0;
    padding-top:16px;
}
.twitter-hint{
    font-size:12px;color:#888;margin:4px 0 0;line-height:1.5;
}
.add-feed-form{margin:0 12px;padding-bottom:10px;}
.keyword-block-section{
    border-top:2px solid #4CAF50;
    margin:20px 12px 0;
    padding-top:16px;
}
.keyword-block-title{
    font-size:16px;
    font-weight:600;
    margin:0 0 8px;
    color:#222;
}
.keyword-list{
    margin:8px 12px 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.keyword-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#f5f5f5;
    border:1px solid #ddd;
    border-radius:16px;
    padding:4px 6px 4px 12px;
    font-size:13px;
    color:#333;
}
.keyword-tag .kw-text{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.keyword-tag button{
    border:none;
    background:#e0e0e0;
    color:#555;
    width:22px;
    height:22px;
    border-radius:50%;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
}
.keyword-tag button:hover{background:#ccc;color:#222;}
.keyword-tag .kw-edit{background:#e8f4fd;color:#1d9bf0;}
.keyword-tag .kw-edit:hover{background:#d0e9fc;}
#addKeywordBtn{background:#1d9bf0;color:#fff;border:none;padding:0 16px;border-radius:8px;font-size:15px;min-width:70px;}

.empty-tip{text-align:center;padding:100px 10px;color:#777;font-size:16px;}
.error-tip{text-align:center;padding:30px 10px;color:#c0392b;font-size:15px;margin-bottom:10px;}
.update-tip-bar{
    background:#e6f7ff;
    border:1px solid #91caff;
    border-radius:0;
    padding:12px;
    text-align:center;
    color:#0050b3;
    margin-bottom:0;
    cursor:pointer;
    font-size:15px;
}
.no-update-tip{
    background:#f0f2f5;
    border:1px solid #dcdcdc;
    border-radius:0;
    padding:12px;
    text-align:center;
    color:#666;
    margin-bottom:0;
    font-size:15px;
}
.load-more-tip{
    text-align:center;padding:14px 0;color:#888;font-size:13px;
}

.card-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}
.card-avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    position:relative;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.card-avatar svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.card-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}
.source-name-text{
    font-size:16px;
    font-weight:600;
    color:#111;
}
.card-title-wrap{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;}
.card-title{
    flex:1;
    font-size:15px;
    font-weight:normal;
    color:#000;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    max-height:2.9em;
    overflow:hidden;
    line-height:1.45;
    word-break:break-all;
}
.card-title .mention{color:#1d9bf0;font-weight:600;word-break:break-all;}
.card-title.expand{
    -webkit-line-clamp:999;
    max-height:none;
}
.title-toggle-btn{
    font-size:13px;
    color:#1d9bf0;
    border:none;
    background:transparent;
    white-space:nowrap;
    display:none;
}
.img-grid{display:grid;gap:2px;}
.grid-single{grid-template-columns:1fr;}
.grid-multi{grid-template-columns:1fr 1fr;}
.grid-img-box{position:relative;aspect-ratio:1/1;overflow:hidden;background:#e9edf0;}
.grid-img{
    width:100%;height:100%;object-fit:cover;display:block;
}
.img-overlay-more{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}
.media-video, .media-video-mp4{
    width: 100%;
    height: 100%;
    display: block;
    background:#000;
    object-fit: cover;
    cursor:pointer;
}
.media-video::-webkit-media-controls-start-playback-button,
.media-video-mp4::-webkit-media-controls-start-playback-button{
    display:none !important;
    -webkit-appearance:none;
}
.custom-media-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:38px;
    padding:0 8px;
    display:flex;
    align-items:center;
    gap:8px;
    background:transparent;
    color:#fff;
    z-index:3;
}
.media-control-btn{
    width:30px;
    height:30px;
    border:none;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
}
.media-control-btn svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
}
.media-control-btn .fill-icon{
    fill:currentColor;
    stroke:none;
}
.media-progress{
    flex:1;
    min-width:0;
    height:4px;
    appearance:none;
    -webkit-appearance:none;
    border-radius:999px;
    background:linear-gradient(to right,
        #28a745 0%,
        #28a745 var(--played, 0%),
        #40bfff var(--played, 0%),
        #40bfff var(--buffered, 0%),
        rgba(255,255,255,.35) var(--buffered, 0%),
        rgba(255,255,255,.35) 100%);
    outline:none;
}
.media-progress::-webkit-slider-runnable-track{
    height:4px;
    border-radius:999px;
    background:transparent;
}
.media-progress::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;
    height:12px;
    margin-top:-4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 4px rgba(0,0,0,.35);
}
.media-progress::-moz-range-track{
    height:4px;
    border-radius:999px;
    background:transparent;
}
.media-progress::-moz-range-thumb{
    width:12px;
    height:12px;
    border:none;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 4px rgba(0,0,0,.35);
}
.media-time{
    width:44px;
    text-align:right;
    font-size:12px;
    color:#fff;
    font-variant-numeric:tabular-nums;
    visibility:hidden;
}
.media-time.show{
    visibility:visible;
}
.media-video.is-playing + .custom-media-controls,
.media-video-mp4.is-playing + .custom-media-controls{
    opacity:.82;
}
.bottom-tip{text-align:center;padding:18px 0;color:#999;font-size:12px;}

.modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;
    align-items:center;justify-content:center;z-index:9999;padding:12px;
}
.modal-box{width:100%;max-width:480px;background:#fff;padding:16px;border-radius:12px;}
.modal-box input,.modal-box select{width:100%;margin-bottom:10px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;}
.modal-btn-bar{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;}
#clearModal .modal-btn-bar button,
#exportModal .modal-btn-bar button{
    border:none;
    padding:8px 18px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    background:#1d9bf0;
    color:#fff;
}
#clearModal .modal-btn-bar button:hover,
#exportModal .modal-btn-bar button:hover{background:#0d8bf0;}
.clear-options{display:flex;flex-direction:column;gap:10px;margin:12px 0;}
.clear-options label{display:flex;align-items:center;gap:8px;font-size:14px;color:#333;cursor:pointer;}
.clear-options input[type="checkbox"]{width:18px;height:18px;cursor:pointer;}
#cancelEdit{
    border:none;
    padding:8px 18px;
    border-radius:999px;
    font-size:15px;
    background:#6c757d;
    color:#fff;
}
#saveEdit{
    border:none;
    padding:8px 18px;
    border-radius:999px;
    font-size:15px;
    background:#28a745;
    color:#fff;
}

.img-preview-mask{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display:none;
    align-items:center;justify-content:center;
    z-index:9999;
    touch-action:none;
}
.preview-wrap{
    width:100%;height:100%;
    overflow:hidden;
    position:relative;
}
.preview-slide{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    box-sizing:border-box;
    will-change:transform;
}
.preview-img{max-width:92vw;max-height:92vh;object-fit:contain;}
.preview-close{
    position:absolute;
    bottom:30px;
    right:25px;
    color:#fff;
    font-size:28px;
    border:none;
    background:transparent;
    cursor:pointer;
    z-index:10;
}
.preview-tip{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:14px;background:rgba(0,0,0,0.4);padding:6px 14px;border-radius:16px;
}
.tip-toast{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,0.65);color:#fff;padding:8px 16px;border-radius:20px;display:none;font-size:14px;
}
.card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    flex-wrap:wrap;
    gap:6px;
}
.card-bottom-left{font-size:12px;color:#666;}
.card-bottom-right{display:flex;gap:8px;}
.card-bottom-right button{
    border:none;
    background:#f2f3f5;
    color:#444;
    font-size:13px;
    border-radius:999px;
    width:30px;
    height:30px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
}
.card-bottom-right button svg{width:16px;height:16px;stroke:currentColor;}
.btn-share{color:#555;}
.btn-fav{color:#555;}
.btn-fav.collected{color:#ff9500;background:#fff4e5;}
.fav-card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
}
/* 收藏卡片底部右侧（分享+删除）与主页卡片底部样式一致；删除按钮保持透明橙色的原外观 */
.fav-card-bottom .card-bottom-right .del-fav{
    background:transparent;color:#ff9500;width:auto;height:auto;padding:4px;gap:0;
}
.fav-card-bottom .card-bottom-right .del-fav svg{width:20px;height:20px;stroke:currentColor;}
.del-fav{
    border:none;
    background:transparent;
    padding:4px;
    cursor:pointer;
    color:#ff9500;
    display:flex;
    align-items:center;
    justify-content:center;
}
.del-fav svg{width:20px;height:20px;stroke:currentColor;}
.update-float-bar{
    position:fixed;
    top:56px;
    left:50%;
    transform:translateX(-50%);
    z-index:10000;
    max-width:calc(100% - 24px);
    background:rgba(64, 190, 255, .45);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.45);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
</style>

</head>
<body>
<header id="mainHeader">
<div class="title-wrap">
  <h1 id="pageTitle">RSS媒体阅读器</h1>
  <span class="beta-tag">4.8</span>
</div>
</header>

<div class="main-wrap">
    <div class="page-home" id="pageHome" style="display: block;">
        <div id="articleBox"><div class="empty-tip">暂无文章内容</div></div>
    </div>
    <div class="page-single" id="pageSingle" style="display: none;">
        <div id="articleBoxSingle"><div class="empty-tip">暂无文章内容</div></div>
    </div>
    <div class="page-manage" id="pageManage" style="display: none;">
        <div class="feed-top-op">
    <button id="importFeed">一键导入</button>
    <button id="exportAllBtn">一键导出</button>
    <button id="delAllFeed">一键清空</button>
    <input type="file" id="importFileInput" accept=".json" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;">
</div>
        <div class="feed-list" id="feedPanel"></div>
    </div>
    <div class="page-add" id="pageAdd" style="display: none;">
        <div class="add-feed-form">
            <div class="keyword-block-title">添加新订阅</div>
            <div class="add-feed-row">
                <input id="feedUrl" placeholder="粘贴标准RSS订阅链接">
            </div>
            <div class="add-feed-row">
                <input id="feedName" placeholder="自定义订阅名称" style="flex:1;">
                <button id="confirmAdd">添加</button>
            </div>
        </div>
        <div class="twitter-block-section">
            <div class="keyword-block-title">添加 Twitter 订阅</div>
            <div class="add-feed-row">
                <input id="twitterUserInput" placeholder="输入 Twitter 用户名">
                <button id="confirmAddTwitter">添加</button>
            </div>
        </div>
        <div class="keyword-block-section">
            <div class="keyword-block-title">关键字屏蔽</div>
            <div class="add-feed-row">
                <input id="blockKeywordInput" placeholder="输入要屏蔽的关键字">
                <button id="addKeywordBtn">添加</button>
            </div>

<div class="modal-mask" id="editModal">
    <div class="modal-box">
        <h3>编辑订阅源</h3>
        <input id="editIndex" type="hidden">
        <input id="editName" placeholder="自定义订阅名称">
        <input id="editUrl" placeholder="RSS订阅链接">
        <div class="modal-btn-bar">
            <button id="cancelEdit">取消</button>
            <button id="saveEdit">保存修改</button>
        </div>

</div>

<div class="modal-mask" id="clearModal">
    <div class="modal-box">
        <h3>一键清空</h3>
        <div class="clear-options">
            <label><input type="checkbox" id="clearFeeds" checked=""> 清除所有订阅源</label>
            <label><input type="checkbox" id="clearArticles" checked=""> 清除主页所有内容</label>
            <label><input type="checkbox" id="clearFav" checked=""> 清除收藏所有内容</label>
            <label><input type="checkbox" id="clearKeywords" checked=""> 清除关键字屏蔽记录</label>
        </div>
        <div class="modal-btn-bar">
            <button id="cancelClear">取消</button>
            <button id="confirmClear">确认清除</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="exportModal">
    <div class="modal-box">
        <h3>导出数据</h3>
        <div class="clear-options">
            <label><input type="checkbox" id="exportFeeds" checked=""> 所有订阅源列表</label>
