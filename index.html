<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RSS媒体阅读器</title>
<!-- hls.js 改为「同源自托管」（v1.7.3），文件为 js/hls.min.js。原因：
     ① 不再依赖 unpkg CDN —— 国内网络下该 CDN 超时/被拦截会导致所有 m3u8 视频无法播放；
     ② 版本锁定在自己的仓库，不受 CDN 删版本/改内容影响。
     升级方式：从 https://unpkg.com/hls.js@<版本>/dist/hls.min.js 下载后覆盖 js/hls.min.js，
     并同步更新本注释里的版本号。 -->
<script src="js/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto;}
html {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  height: 100%;
  background: #e0e0e0;
}
body{
  background:#ffffff;color:#111;
  height: 100%;
  margin: 0 auto;
  max-width: 430px;
  position: relative;
}

/* 顶部标题区已移除（2026-11-19）：内容顶格显示，仅保留刘海屏安全区避让 */

/* 视频缓冲中遮罩（P0-3：区分“在缓冲”与“真卡死”） */
.video-buffering{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:none; align-items:center; justify-content:center; gap:8px;
    background:rgba(0,0,0,0.30); color:#fff; font-size:13px;
    z-index:50; pointer-events:none;
}
.vb-spinner{
    width:16px; height:16px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%;
    animation:vb-spin .7s linear infinite;
}
@keyframes vb-spin{ to{ transform:rotate(360deg); } }

/* 卡片样式 */
.tweet-card{
    background:#fff;
    border:none;
    border-radius:0;
    padding:14px;
    border-bottom:1px solid #dddddd;
    margin-bottom:0;
}

.img-grid-wrap{
    border-radius:10px;
    overflow:hidden;
    background:#f0f0f0;
    margin:6px 0;
}
.video-single-wrap{
    width:100%;
    position:relative;
    border-radius:10px;
    overflow:hidden;
    margin:6px 0;
    background:#000;
    height: auto;
}
.video-single-wrap:fullscreen{
    width:100vw;
    height:100vh;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
}
.video-single-wrap:-webkit-full-screen{
    width:100vw;
    height:100vh;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* 骨架屏微光：推文配图占位，消除布局抖动（CLS），观感更顺 */
.grid-img-box{
    background:#ededed;
    background-image:linear-gradient(100deg,#ededed 30%,#f6f6f6 50%,#ededed 70%);
    background-size:200% 100%;
    animation:vs-shimmer 1.4s linear infinite;
}
.grid-img{background:transparent;animation:none;}
/* 图片加载失败时：停掉骨架屏微光，改为静态灰底占位，避免一直频闪 */
.grid-img-box.img-failed{animation:none;background:#e8e8e8;}

@keyframes vs-shimmer{to{background-position:-200% 0;}}

/* 底部悬浮导航栏（2026-11-19 改版）：矩形大圆角、白色半透明悬浮、滚动自动隐藏 */
.bottom-nav-bar{
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    margin: 0 auto;
    /* 左右内缩 14px，与卡片内媒体区域的左右边缘对齐；上限收窄到 402px 保证桌面端也对齐 430px 内容列 */
    max-width: 402px;
    width: calc(100% - 28px);
    height: 48px;
    background: rgba(255,255,255,0.88);
    border-radius: 26px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.16);
    z-index: 9999;
    display:flex;
    justify-content:space-around;
    overflow: hidden;
}
.bottom-nav-bar button{
    flex:1;
    height:100%;
    border:none;
    background:transparent;
    position: relative;
    /* 图标 + 文字纵向排列 */
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
}
/* 图标缩小给文字腾位，导航栏总高不变 */
.bottom-nav-bar button svg{width:19px;height:19px;}
.nav-label{
    font-size:10px;
    line-height:1;
    color:#111111;
    pointer-events:none;
}
/* 选中状态：图标与文字一起变绿 */
.bottom-nav-bar button.active .nav-label{color:#28a745;}
/* 选中状态：图标变绿色 */
.bottom-nav-bar button.active svg{
    stroke:#28a745 !important;
}
/* 底部蓝色横线（改回蓝色）：缩短长度、随悬浮圆角上移不贴边 */
.bottom-nav-bar button.active::after{
    content:"";
    position:absolute;
    left:33%;
    right:33%;
    bottom:4px;
    height:4px;
    background:#0066dd;
    border-radius:4px;
}

.bottom-nav-bar::-webkit-scrollbar {
    display: none !important;
}

/* 页内标题（随内容滚动，非悬浮、无角标）：文字居中，白色填充 */
.page-title{
    font-size:19px;
    font-weight:600;
    text-align:center;
    padding:13px 14px;
    background:#ffffff;
}

.main-wrap{
    padding-top: max(0px, env(safe-area-inset-top));
    padding-bottom: 74px;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
}
.page-home,.page-manage,.page-add,.page-fav,.page-search,.page-single{display:none;}
#pageHome,#pageManage,#pageFav,#pageSearch{
    width: 100%;
}
#pageAdd{
    width: 100%;
}

.feed-top-op{
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
    justify-content:center;
    /* 顶部不留白：与页内标题区（绿色半透明）无缝衔接；底部与分区标题栏无缝 */
    margin:0;
    padding:10px 10px;
    background:#1a5276;
}
.feed-top-op button{
    flex:1 1 0;
    max-width:92px;
    padding:7px 0;
    border:none;
    border-radius:6px;
    font-size:14px;
    line-height:1;
    color:#fff;
    text-align:center;
    cursor:pointer;
    white-space:nowrap;
}
#importFeed{background:#42a5f5;}
#exportAllBtn{background:#42a5f5;}
#delAllFeed{background:#42a5f5;}
/* 分区标题：两种颜色填充区分普通订阅与 Twitter 订阅 */
.feed-section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    color:#fff;
    font-size:14px;
    font-weight:bold;
}
.feed-section-title .sec-title-left{display:flex;align-items:baseline;gap:6px;}
.feed-section-title .sec-count{font-size:12px;font-weight:normal;opacity:.85;}
.feed-section-title .sec-mark-btn{
    background:rgba(255,255,255,.28);
    border:none;color:#fff;
    font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;
}
.feed-section-title .sec-mark-btn:active{background:rgba(255,255,255,.45);}
.feed-section-title.section-normal{background:#1d9bf0;}
.feed-section-title.section-twitter{background:#28a745;}
.feed-section-empty{padding:14px 12px;font-size:13px;color:#999;text-align:center;background:#fafafa;}
/* 我的收藏：九宫格 */
.fav-grid{
    display:grid;
    /* minmax(0,1fr) 强制三列等宽：1fr 会被内容最小宽度撑破导致列宽不一 */
    grid-template-columns:repeat(3,minmax(0,1fr));
    padding:0;
    background:#fff;
}
.fav-grid-cell{
    padding:7px 7px 4px;
    border-right:1px solid #ddd;
    border-bottom:1px solid #ddd;
    /* 防止单元格内容把轨道撑宽溢出视口（第三列右侧显示不全的根因） */
    min-width:0;
    overflow:hidden;
}
/* 每行第 3 个去掉右侧竖线 */
.fav-grid-cell:nth-child(3n){border-right:none;}
/* 头部：订阅头像 + 名称 */
.fav-cell-head{
    display:flex;
    align-items:center;
    gap:5px;
    padding:0 0 5px;
    min-width:0;
}
.fav-cell-avatar{width:18px;height:18px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;}
.fav-cell-avatar svg{width:14px;height:14px;}
.fav-cell-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.fav-cell-title{
    font-size:11px;color:#333;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;min-width:0;
}
/* 中部：正方形圆角媒体区 */
.fav-cell-media{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:8px;
    overflow:hidden;
    background:#ececec;
    cursor:pointer;
}
.fav-cell-media img{
    width:100%;height:100%;
    object-fit:cover;display:block;
}
.fav-cell-media .fav-play-badge{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:34px;height:34px;border-radius:50%;
    background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
}
.fav-cell-media .fav-play-badge svg{width:16px;height:16px;fill:#fff;margin-left:2px;}
/* 底部：更新时间（左）+ 分享/收藏按钮（右） */
.fav-cell-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:3px 1px 1px;
    min-width:0;
}
.fav-cell-date{font-size:11px;color:#999;flex-shrink:0;}
.fav-cell-ops{display:flex;align-items:center;gap:0;flex-shrink:0;}
.fav-cell-ops button{
    border:none;background:transparent;
    width:24px;height:24px;padding:3px;
    border-radius:6px;cursor:pointer;
    color:#888;display:flex;align-items:center;justify-content:center;
}
.fav-cell-ops button svg{width:16px;height:16px;stroke:currentColor;}
/* 收藏按钮：默认实心绿色（已收藏）；标记待取消后变灰色空心 */
.fav-cell-ops button.cell-unfav{color:#28a745;}
.fav-cell-ops button.cell-unfav.pending{color:#999;}
.fav-cell-ops button:active{background:#f0f0f0;}
/* 收藏全屏播放层 */
#favPlayerLayer{
    position:fixed;inset:0;
    background:#000;z-index:10000;
    display:none;align-items:center;justify-content:center;
}
#favPlayerLayer.show{display:flex;}
#favPlayerContent{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#favPlayerContent video,#favPlayerContent img{max-width:100%;max-height:100%;object-fit:contain;}
#favPlayerClose{
    position:absolute;top:12px;right:14px;z-index:10001;
    background:rgba(255,255,255,.22);border:none;color:#fff;
    font-size:20px;line-height:1;border-radius:50%;
    width:36px;height:36px;cursor:pointer;
}
.feed-list{background:#fff;}
.feed-item{
    padding:6px 10px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    /* 长按唤出操作面板：禁用系统文本选择/长按菜单，避免误触 */
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}
/* 长按防误触加强：覆盖条目内所有子元素，彻底禁用系统文本选择与长按复制/粘贴菜单 */
.feed-item *{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}
.feed-item:last-child{border-bottom:none;}

.feed-left-area{
    display:flex;
    align-items:flex-start;
    gap:8px;
    flex:1;
    min-width:0;
}
.feed-index{
    width:24px;
    text-align:center;
    font-size:14px;
    color:#666;
    flex-shrink:0;
    line-height:24px;
}
.feed-name-block{
    flex:1;
    min-width:0;
}
.feed-title-text{
    font-size:14px;
    font-weight:700;
    font-family:"SimSun","宋体","Songti SC","Noto Serif CJK SC",serif;
    color:#111;
    word-break:break-all;
    line-height:1.35;
}
.feed-update-time{
    font-size:12px;
    color:#999;
    margin-top:2px;
    line-height:1.2;
}
.feed-unread-badge-inline{
    display:inline-block;
    min-width:16px;
    height:16px;
    line-height:16px;
    padding:0 4px;
    background:#ff3b30;
    color:#fff;
    font-size:11px;
    font-weight:600;
    border-radius:8px;
    text-align:center;
    box-sizing:border-box;
    margin-right:6px;
    vertical-align:middle;
}

.add-feed-row{display:flex;flex-wrap:wrap;gap:10px;margin:15px 12px;}
.add-feed-row input{
    flex:1;
    min-width:140px;
    padding:8px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}
.add-feed-row button{
    background:#1d9bf0;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:15px;min-width:70px;flex-shrink:0;cursor:pointer;
}
#addKeywordBtn{background:#1d9bf0;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:15px;min-width:70px;flex-shrink:0;cursor:pointer;}
.twitter-block-section{
    border-top:2px solid #4CAF50;
    margin:20px 12px 0;
    padding-top:16px;
}
.twitter-hint{
    font-size:12px;color:#888;margin:4px 0 0;line-height:1.5;
}
.add-feed-form{margin:0 12px;padding-bottom:10px;}
.keyword-block-section{
    border-top:2px solid #4CAF50;
    margin:20px 12px 0;
    padding-top:16px;
}
.keyword-block-title{
    font-size:16px;
    font-weight:600;
    margin:0 0 8px;
    color:#222;
}
.keyword-list{
    margin:8px 12px 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.keyword-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#f5f5f5;
    border:1px solid #ddd;
    border-radius:16px;
    padding:4px 6px 4px 12px;
    font-size:13px;
    color:#333;
}
.keyword-tag .kw-text{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.keyword-tag button{
    border:none;
    background:#e0e0e0;
    color:#555;
    width:22px;
    height:22px;
    border-radius:50%;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
}
.keyword-tag button:hover{background:#ccc;color:#222;}
.keyword-tag .kw-edit{background:#e8f4fd;color:#1d9bf0;}
.keyword-tag .kw-edit:hover{background:#d0e9fc;}
#addKeywordBtn{background:#1d9bf0;color:#fff;border:none;padding:0 16px;border-radius:8px;font-size:15px;min-width:70px;}

.empty-tip{text-align:center;padding:100px 10px;color:#777;font-size:16px;}
.error-tip{text-align:center;padding:30px 10px;color:#c0392b;font-size:15px;margin-bottom:10px;}
.update-tip-bar{
    background:#e6f7ff;
    border:1px solid #91caff;
    border-radius:0;
    padding:12px;
    text-align:center;
    color:#0050b3;
    margin-bottom:0;
    cursor:pointer;
    font-size:15px;
}
.no-update-tip{
    background:#f0f2f5;
    border:1px solid #dcdcdc;
    border-radius:0;
    padding:12px;
    text-align:center;
    color:#666;
    margin-bottom:0;
    font-size:15px;
}
.load-more-tip{
    text-align:center;padding:14px 0;color:#888;font-size:13px;
}

.card-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}
.card-avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    position:relative;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.card-avatar svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.card-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}
/* Twitter 订阅真头像叠加层：绝对定位盖住字母图标，加载失败 onerror 移除自动回退 */
.feed-real-avatar{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}
.source-name-text{
    font-size:16px;
    font-weight:600;
    color:#111;
}
.card-title-wrap{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;}
.card-title{
    flex:1;
    font-size:15px;
    font-weight:normal;
    color:#000;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    max-height:2.9em;
    overflow:hidden;
    line-height:1.45;
    word-break:break-all;
}
.card-title .mention{color:#1d9bf0;font-weight:600;word-break:break-all;}
.card-title.expand{
    -webkit-line-clamp:999;
    max-height:none;
}
.title-toggle-btn{
    font-size:13px;
    color:#1d9bf0;
    border:none;
    background:transparent;
    white-space:nowrap;
    display:none;
}
.img-grid{display:grid;gap:2px;}
.grid-single{grid-template-columns:1fr;}
.grid-multi{grid-template-columns:1fr 1fr;}
.grid-img-box{position:relative;aspect-ratio:1/1;overflow:hidden;background:#e9edf0;}
.grid-img{
    width:100%;height:100%;object-fit:cover;display:block;
}
.img-overlay-more{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}
.media-video, .media-video-mp4{
    width: 100%;
    height: 100%;
    display: block;
    background:#000;
    object-fit: cover;
    cursor:pointer;
}
.media-video::-webkit-media-controls-start-playback-button,
.media-video-mp4::-webkit-media-controls-start-playback-button{
    display:none !important;
    -webkit-appearance:none;
}
.custom-media-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:38px;
    padding:0 8px;
    display:flex;
    align-items:center;
    gap:8px;
    background:transparent;
    color:#fff;
    z-index:3;
}
.media-control-btn{
    width:30px;
    height:30px;
    border:none;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
}
.media-control-btn svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
}
.media-control-btn .fill-icon{
    fill:currentColor;
    stroke:none;
}
.media-progress{
    flex:1;
    min-width:0;
    height:4px;
    appearance:none;
    -webkit-appearance:none;
    border-radius:999px;
    background:linear-gradient(to right,
        #28a745 0%,
        #28a745 var(--played, 0%),
        #40bfff var(--played, 0%),
        #40bfff var(--buffered, 0%),
        rgba(255,255,255,.35) var(--buffered, 0%),
        rgba(255,255,255,.35) 100%);
    outline:none;
}
.media-progress::-webkit-slider-runnable-track{
    height:4px;
    border-radius:999px;
    background:transparent;
}
.media-progress::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;
    height:12px;
    margin-top:-4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 4px rgba(0,0,0,.35);
}
.media-progress::-moz-range-track{
    height:4px;
    border-radius:999px;
    background:transparent;
}
.media-progress::-moz-range-thumb{
    width:12px;
    height:12px;
    border:none;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 4px rgba(0,0,0,.35);
}
.media-time{
    width:44px;
    text-align:right;
    font-size:12px;
    color:#fff;
    font-variant-numeric:tabular-nums;
    visibility:hidden;
}
.media-time.show{
    visibility:visible;
}
.media-video.is-playing + .custom-media-controls,
.media-video-mp4.is-playing + .custom-media-controls{
    opacity:.82;
}
.bottom-tip{text-align:center;padding:18px 0;color:#999;font-size:12px;}

.modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;
    align-items:center;justify-content:center;z-index:9999;padding:12px;
}
.modal-box{width:100%;max-width:480px;background:#fff;padding:16px;border-radius:12px;}
.modal-box input,.modal-box select{width:100%;margin-bottom:10px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;}
.modal-btn-bar{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;}
/* 长按订阅源操作面板的竖排按钮 */
/* 长按小气泡：贴近触发条目浮出，风格与整体卡片一致 */
#feedPopover{
    display:none;
    position:fixed;
    z-index:3000;
    min-width:140px;
    background:#fff;
    border:1px solid #e2e2e2;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,0.16);
    padding:6px;
    /* 气泡自身也不触发系统选择/长按菜单 */
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}
#feedPopoverTitle{
    font-size:12px;color:#999;padding:6px 10px 4px;
    max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    border-bottom:1px solid #f0f0f0;margin-bottom:4px;
}
#feedPopover button{
    display:block;width:100%;
    border:none;background:transparent;
    padding:10px 12px;font-size:14px;color:#333;
    text-align:left;border-radius:8px;cursor:pointer;
}
#feedPopover button:active{background:#e8f1fb;}
#feedPopover button.fa-danger{color:#d93025;}
#clearModal .modal-btn-bar button,
#exportModal .modal-btn-bar button{
    border:none;
    padding:8px 18px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    background:#1d9bf0;
    color:#fff;
}
#clearModal .modal-btn-bar button:hover,
#exportModal .modal-btn-bar button:hover{background:#0d8bf0;}
.clear-options{display:flex;flex-direction:column;gap:10px;margin:12px 0;}
.clear-options label{display:flex;align-items:center;gap:8px;font-size:14px;color:#333;cursor:pointer;}
.clear-options input[type="checkbox"]{width:18px;height:18px;cursor:pointer;}
#cancelEdit{
    border:none;
    padding:8px 18px;
    border-radius:999px;
    font-size:15px;
    background:#6c757d;
    color:#fff;
}
#saveEdit{
    border:none;
    padding:8px 18px;
    border-radius:999px;
    font-size:15px;
    background:#28a745;
    color:#fff;
}

.img-preview-mask{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display:none;
    align-items:center;justify-content:center;
    z-index:9999;
    touch-action:none;
}
.preview-wrap{
    width:100%;height:100%;
    overflow:hidden;
    position:relative;
}
.preview-slide{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    box-sizing:border-box;
    will-change:transform;
}
.preview-img{max-width:92vw;max-height:92vh;object-fit:contain;}
.preview-close{
    position:absolute;
    bottom:30px;
    right:25px;
    color:#fff;
    font-size:28px;
    border:none;
    background:transparent;
    cursor:pointer;
    z-index:10;
}
.preview-tip{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:14px;background:rgba(0,0,0,0.4);padding:6px 14px;border-radius:16px;
}
.tip-toast{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,0.65);color:#fff;padding:8px 16px;border-radius:20px;display:none;font-size:14px;
}
.card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    flex-wrap:wrap;
    gap:6px;
}
.card-bottom-left{font-size:12px;color:#666;}
.card-bottom-right{display:flex;gap:8px;}
.card-bottom-right button{
    border:none;
    background:#f2f3f5;
    color:#444;
    font-size:13px;
    border-radius:999px;
    width:30px;
    height:30px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
}
.card-bottom-right button svg{width:16px;height:16px;stroke:currentColor;}
.btn-share{color:#555;}
.btn-fav{color:#555;}
.btn-fav.collected{color:#ff9500;background:#fff4e5;}
.fav-card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
}
/* 收藏卡片底部右侧（分享+删除）与主页卡片底部样式一致；删除按钮保持透明橙色的原外观 */
.fav-card-bottom .card-bottom-right .del-fav{
    background:transparent;color:#ff9500;width:auto;height:auto;padding:4px;gap:0;
}
.fav-card-bottom .card-bottom-right .del-fav svg{width:20px;height:20px;stroke:currentColor;}
.del-fav{
    border:none;
    background:transparent;
    padding:4px;
    cursor:pointer;
    color:#ff9500;
    display:flex;
    align-items:center;
    justify-content:center;
}
.del-fav svg{width:20px;height:20px;stroke:currentColor;}
.update-float-bar{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:10000;
    max-width:calc(100% - 24px);
    background:rgba(64, 190, 255, .45);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.45);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
</style>

</head>
<body>
<div class="main-wrap">
    <div class="page-home" id="pageHome" style="display: block;">
        <div id="articleBox"><div class="empty-tip">暂无文章内容</div></div>
    </div>
    <div class="page-single" id="pageSingle" style="display: none;">
        <div id="articleBoxSingle"><div class="empty-tip">暂无文章内容</div></div>
    </div>
    <div class="page-manage" id="pageManage" style="display: none;">
        <div class="page-title">管理订阅</div>
        <div class="feed-top-op">
    <button id="importFeed">一键导入</button>
    <button id="exportAllBtn">一键导出</button>
    <button id="delAllFeed">一键清空</button>
    <input type="file" id="importFileInput" accept=".json" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;">
</div>
        <div class="feed-list" id="feedPanel"></div>
    </div>
    <div class="page-add" id="pageAdd" style="display: none;">
        <div class="page-title">添加订阅</div>
        <div class="add-feed-form">
            <div class="keyword-block-title">添加新订阅</div>
            <div class="add-feed-row">
                <input id="feedUrl" placeholder="粘贴标准RSS订阅链接">
            </div>
            <div class="add-feed-row">
                <input id="feedName" placeholder="自定义订阅名称" style="flex:1;">
                <button id="confirmAdd">添加</button>
            </div>
        </div>
        <div class="twitter-block-section">
            <div class="keyword-block-title">添加 Twitter 订阅</div>
            <div class="add-feed-row">
                <input id="twitterUserInput" placeholder="输入 Twitter 用户名">
                <button id="confirmAddTwitter">添加</button>
            </div>
        </div>
        <div class="keyword-block-section">
            <div class="keyword-block-title">关键字屏蔽</div>
            <div class="add-feed-row">
                <input id="blockKeywordInput" placeholder="输入要屏蔽的关键字">
                <button id="addKeywordBtn">添加</button>
            </div>
            <div class="keyword-list" id="keywordList"><div style="color:#999;font-size:13px;padding:8px 4px;">暂无屏蔽关键字</div></div>
        </div>
    </div>
    <div class="page-fav" id="pageFav" style="display: none;"><div class="page-title">我的收藏</div><div id="favPanel"></div></div>
    <div class="page-search" id="pageSearch" style="display: none;">
        <div class="page-title">内容搜索</div>
        <div style="padding:12px;">
            <input id="searchInput" placeholder="输入关键词精确匹配标题" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;font-size:16px;">
            <div id="searchResultBox"></div>
        </div>
    </div>
</div>

<div class="bottom-nav-bar">
    <button id="btnHome" class="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>

        <span class="nav-label">添加</span>

    <button id="btnManage" class="">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <span class="nav-label">收藏</span>

</div>

<!-- 收藏九宫格点击后的全屏播放层 -->
<div id="favPlayerLayer">
    <button id="favPlayerClose">✕</button>
    <div id="favPlayerContent"></div>
</div>

<div class="modal-mask" id="editModal">
    <div class="modal-box">
        <h3>编辑订阅源</h3>
        <input id="editIndex" type="hidden">
        <input id="editName" placeholder="自定义订阅名称">
        <input id="editUrl" placeholder="RSS订阅链接">
        <div class="modal-btn-bar">
            <button id="cancelEdit">取消</button>
            <button id="saveEdit">保存修改</button>
        </div>
    </div>
</div>

<!-- 长按订阅源弹出的操作面板（标记已读 / 编辑 / 删除） -->
<!-- 长按订阅源的小气泡操作菜单：absolute 定位由 JS 计算到条目附近，非全屏遮罩 -->
<div id="feedPopover">
    <div id="feedPopoverTitle">订阅操作</div>
    <button id="feedActionRead">✓ 标记已读</button>
    <button id="feedActionEdit">✎ 编辑</button>
    <button id="feedActionDel" class="fa-danger">🗑 删除</button>
</div>

<div class="modal-mask" id="clearModal">
    <div class="modal-box">
        <h3>一键清空</h3>
        <div class="clear-options">
            <label><input type="checkbox" id="clearFeeds" checked=""> 清除所有订阅源</label>
            <label><input type="checkbox" id="clearArticles" checked=""> 清除主页所有内容</label>
            <label><input type="checkbox" id="clearFav" checked=""> 清除收藏所有内容</label>
            <label><input type="checkbox" id="clearKeywords" checked=""> 清除关键字屏蔽记录</label>
        </div>
        <div class="modal-btn-bar">
            <button id="cancelClear">取消</button>
            <button id="confirmClear">确认清除</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="exportModal">
    <div class="modal-box">
        <h3>导出数据</h3>
        <div class="clear-options">
            <label><input type="checkbox" id="exportFeeds" checked=""> 所有订阅源列表</label>
            <label><input type="checkbox" id="exportFav" checked=""> 收藏记录数据</label>
            <label><input type="checkbox" id="exportKeywords" checked=""> 关键字屏蔽</label>
        </div>
        <div class="modal-btn-bar">
            <button id="cancelExport">取消</button>
            <button id="confirmExport">确认导出</button>
        </div>
    </div>
</div>

<div class="img-preview-mask" id="imgPreviewMask">
    <button class="preview-close" id="previewClose">×</button>

    <div class="preview-tip" id="previewTip"></div>
</div>
