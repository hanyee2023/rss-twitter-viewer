// 优化：视频封面(poster)加载失败回退。
// buildCard 里给 poster 准备了 data-poster-proxy-fallbacks / data-poster-direct，
// 但 poster 属性本身不会触发 onerror，这里用一次探测请求做回退：
//   1) 主代理失败 → 依次尝试备用代理端点
//   2) 仍失败 → 尝试直连（部分 CDN 在直连可达时可用）
function bindPosterFallback(video){
    const poster = video.getAttribute("poster");
    if(!poster || video.dataset.posterBound) return;
    video.dataset.posterBound = "1";
    const tryNext = () => {
        // 1) 依次尝试备用代理端点
        const fbStr = video.dataset.posterProxyFallbacks;
        if(fbStr){
            try{
                const arr = JSON.parse(fbStr);
                if(arr.length){
                    video.setAttribute("poster", arr.shift());
                    video.dataset.posterProxyFallbacks = JSON.stringify(arr);
                    return;
                }
            }catch(e){}
        }
        // 2) 最后尝试直连（保留 data-poster-direct 提供的原始地址）
        const direct = video.dataset.posterDirect;
        if(direct && video.getAttribute("poster") !== direct){
            video.setAttribute("poster", direct);
        }
    };
    const probe = new Image();
    probe.onerror = tryNext;
    probe.src = poster;
}


function formatMediaTime(seconds){
    if(!Number.isFinite(seconds) || seconds < 0) return "00:00";
    const total = Math.ceil(seconds);
    const h = Math.floor(total / 3600);
    const streamUrl = uniqueSources[sourceIndex] || uniqueSources[0];
    if(!streamUrl) return;

    pauseOtherVideos(video);
    const manualSecondClick = video.dataset.proxyVideo === "1";

    const playNow = (retry = true) => {
        video.play().catch(err => {
            console.warn("m3u8播放失败：", err);
        const isProxyVid = video.dataset.proxyVideo === "1";
        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            maxBufferLength: 60,
            maxMaxBufferLength: 120,
            maxBufferSize: 60 * 1000 * 1000,
            // 代理视频带宽有限：缩短缓冲窗口，减少并发分片请求数，降低卡顿
            maxBufferLength: isProxyVid ? 30 : 60,
            maxMaxBufferLength: isProxyVid ? 60 : 120,
            maxBufferSize: isProxyVid ? 30 * 1000 * 1000 : 60 * 1000 * 1000,
            // 限制向后缓冲，避免长视频内存占用过高
            backBufferLength: isProxyVid ? 30 : 60,
            maxBufferHole: 0.5,
            // 代理视频从最低码率起步，快速起播避免黑屏；非代理视频自动选择
            startLevel: isProxyVid ? 0 : -1,
            capLevelToPlayerSize: true,
                }
            }
            hls.startLoad();
            video.dataset.hlsLoaded = "1";
            // 代理视频采用两次点击模式：第一次仅加载 manifest，不自动播放
            if(!manualSecondClick){
                playNow();
            }
            // 加载完成后立即自动播放（单次点击即可起播）。
            // 用户刚点击过卡片，浏览器 sticky activation 已生效，程序化 play() 通常允许带声音播放；
            // 若个别浏览器仍拦截，playNow 会捕获 NotAllowedError 并提示“请再点一次播放”。
            playNow();
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
            if(data && data.fatal){
                console.warn("HLS致命错误：", data);
            video.removeEventListener("canplay", markNativeLoaded);
        };
        video.addEventListener("loadedmetadata", markNativeLoaded, {once:true});
        video.addEventListener("canplay", markNativeLoaded, {once:true});
        if(manualSecondClick){
            video.load();
        }else{
            playNow();
        }
        // 原生 HLS 同样单次点击起播
        playNow();
    } else {
        if(video.dataset.userAttempted === "1"){
            showToast("当前浏览器不支持m3u8播放");
        }
        }
        if(video.classList.contains("media-video")){
            video.addEventListener("play", ()=>{
            if(!video.dataset.hlsLoaded) {
                video.pause();
                startHlsVideo(video);
                // 仅在 Hls.js 模式下需要回退初始化；原生 HLS 已通过 video.src 处理，
                // 否则会在 play 事件中反复进入 startHlsVideo 造成初始化死循环。
                if(window.Hls && Hls.isSupported()){
                    video.pause();
                    startHlsVideo(video);
                }
            } else if(video.hlsInstance) {
                video.hlsInstance.startLoad();
            }
        });
        // 优化4：绑定错误自动重试
        bindVideoErrorRetry(video);
        // 优化6：绑定低网速检测
        bindSlowNetworkDetect(video);
        // 优化：封面图加载失败回退（修复视频预览图不显示）
        bindPosterFallback(video);
    });
}
