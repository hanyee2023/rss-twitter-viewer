<!-- 早期错误收集器（5.0.1）：必须放在所有脚本之前，包括下面的 hls.js。
     原因：hls.js 从 CDN 加载，且 core/media/feed/app 四个脚本的顶层执行，
     都发生在 log.js 注册 window 错误监听之前。若 CDN 不可达或脚本崩溃，
     运行日志里将一片空白、无从排查。这里先无条件把错误暂存内存，
     等 log.js 就绪后由 window.__setErrorSink 回灌进日志。 -->
<script>
(function(){
    var MAX = 50;                    // 内存暂存上限，防极端情况下刷屏
    var buf = window.__earlyErrors = [];
    var sink = null;                 // log.js 就绪后接管

    function stamp(rec){
        rec.where = rec.where ? ("启动期 " + rec.where) : "启动期";
        return rec;
    }
    function push(rec){
        try{
            if(sink){ sink(rec); return; }
            buf.push(stamp(rec));
            if(buf.length > MAX) buf.shift();
        }catch(e){}
    }
    // 供外部主动上报启动期错误（如 hls.js 的 script onerror）
    window.__reportEarlyError = function(msg, where){
        push({ msg: String(msg == null ? "" : msg), where: where || "" });
    };
    // log.js 调用：接管后续错误，并回灌已暂存记录（按发生顺序）
    window.__setErrorSink = function(fn){
        sink = fn;
        try{
            var pending = buf.splice(0, buf.length);
            for(var i = 0; i < pending.length; i++){
                try{ fn(pending[i]); }catch(e){}
            }
        }catch(e){}
    };

    window.addEventListener("error", function(ev){
        try{
            var msg = (ev && ev.message) ? ev.message : "未知错误";
            // 跨域脚本抛错时，浏览器只给无信息的 "Script error."（不含文件名/行号），需注明来源
            if(/^Script error\.?$/.test(msg)){ msg = "Script error.（跨域脚本抛错，浏览器已隐藏详情）"; }
            if(ev && ev.filename){
                msg += " (" + (String(ev.filename).split("/").pop() || "") +
                       (ev.lineno ? (":" + ev.lineno) : "") + ")";
            }
            push({ msg: msg, where: "前台" });
        }catch(e){}
    });
    window.addEventListener("unhandledrejection", function(ev){
        try{
            var msg = "未处理的异步异常";
            if(ev && ev.reason){ msg = ev.reason.message || String(ev.reason); }
            push({ msg: "未处理异常: " + msg, where: "前台" });
        }catch(e){}
    });
})();
</script>
<!-- hls.js 走 CDN（跨域）。必须加 crossorigin="anonymous"：否则该脚本内部的异常在上报时会被
     浏览器抹成无任何信息的 "Script error."（不含文件名/行号），日志里完全无法定位。
     实测 unpkg 返回 Access-Control-Allow-Origin: *，因此加该属性不会导致加载失败。 -->
<script src="https://unpkg.com/hls.js@1.5.7/dist/hls.min.js" crossorigin="anonymous" onerror="window.__reportEarlyError && window.__reportEarlyError('关键依赖 hls.js 加载失败（CDN 不可达或超时），所有 m3u8 视频将无法播放', '依赖')"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto;}
html {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  height: 100%;
  background: #e0e0e0;
}
body{
  background:#f5f5f5;color:#111;
  height: 100%;
  margin: 0 auto;
  max-width: 430px;
  position: relative;
}

/* 顶部悬浮固定栏 磨砂玻璃 */
#mainHeader{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    margin: 0 auto;
    max-width: 430px;
    width: 100%;
    height: 48px;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    z-index: 9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0 12px;
    box-sizing: border-box;
}

.title-wrap {
  position: relative;
  width: fit-content;
}
.beta-tag {
  position: absolute;
  top: -3px;
  right: -40px;
  font-size: 12px;
  background:#28a745;
  color:#fff;
  padding:2px 8px;
  border-radius:6px;
  z-index:9999;
  white-space:nowrap;
}
#pageTitle{
    font-size:19px;
    font-weight:600;
    white-space:nowrap;
}

/* 视频缓冲中遮罩（P0-3：区分“在缓冲”与“真卡死”） */
.video-buffering{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:none; align-items:center; justify-content:center; gap:8px;
    background:rgba(0,0,0,0.30); color:#fff; font-size:13px;
    z-index:50; pointer-events:none;
}
.vb-spinner{
    width:16px; height:16px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%;
    animation:vb-spin .7s linear infinite;
}
@keyframes vb-spin{ to{ transform:rotate(360deg); } }

/* 卡片样式 */
.tweet-card{
    background:#fff;
    border:none;
    border-radius:0;
    padding:14px;
    border-bottom:1px solid #dddddd;
    margin-bottom:0;
}

.img-grid-wrap{
    border-radius:10px;
    overflow:hidden;
    background:#f0f0f0;
    margin:6px 0;
}
.video-single-wrap{
    width:100%;
    position:relative;
    border-radius:10px;
    overflow:hidden;
    margin:6px 0;
    background:#000;
    height: auto;
}
.video-single-wrap:fullscreen{
    width:100vw;
    height:100vh;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
}
.video-single-wrap:-webkit-full-screen{
    width:100vw;
    height:100vh;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* 骨架屏微光：推文配图占位，消除布局抖动（CLS），观感更顺 */
.grid-img-box{
    background:#ededed;
    background-image:linear-gradient(100deg,#ededed 30%,#f6f6f6 50%,#ededed 70%);
    background-size:200% 100%;
    animation:vs-shimmer 1.4s linear infinite;
}
.grid-img{background:transparent;animation:none;}

@keyframes vs-shimmer{to{background-position:-200% 0;}}

/* 底部悬浮导航栏 磨砂玻璃 */
.bottom-nav-bar{
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    margin: 0 auto;
    max-width: 430px;
    width: 100%;
    height: 50px;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    z-index: 9999;
    display:flex;
    justify-content:space-around;
    overflow: hidden;
}
.bottom-nav-bar button{
    flex:1;
    height:100%;
    border:none;
    background:transparent;
    position: relative;
    /* 图标居中 */
    display:flex;
    align-items:center;
    justify-content:center;
}
/* 选中状态：图标变绿色 */
.bottom-nav-bar button.active svg{
    stroke:#28a745 !important;
}
/* 底部蓝色横线 */
.bottom-nav-bar button.active::after{
    content:"";
    position:absolute;
    left:15%;
    right:15%;
    bottom:0;
    height:4px;
    background:#0066dd;
    border-radius:4px;
}

.bottom-nav-bar::-webkit-scrollbar {
    display: none !important;
}

    font-size:13px;
    border-radius:999px;
    width:30px;
    height:30px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
}
.card-bottom-right button svg{width:16px;height:16px;stroke:currentColor;}
.btn-share{color:#555;}
.btn-fav{color:#555;}
.btn-fav.collected{color:#ff9500;background:#fff4e5;}
.fav-card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
}
/* 收藏卡片底部右侧（分享+删除）与主页卡片底部样式一致；删除按钮保持透明橙色的原外观 */
.fav-card-bottom .card-bottom-right .del-fav{
    background:transparent;color:#ff9500;width:auto;height:auto;padding:4px;gap:0;
}
.fav-card-bottom .card-bottom-right .del-fav svg{width:20px;height:20px;stroke:currentColor;}
.del-fav{
    border:none;
    background:transparent;
    padding:4px;
    cursor:pointer;
    color:#ff9500;
    display:flex;
    align-items:center;
    justify-content:center;
}
.del-fav svg{width:20px;height:20px;stroke:currentColor;}
.update-float-bar{
    position:fixed;
    top:56px;
    left:50%;
    transform:translateX(-50%);
    z-index:10000;
    max-width:calc(100% - 24px);
    background:rgba(64, 190, 255, .45);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.45);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ===== 运行日志（5.0 新增）===== */
.page-log{
    width: 100%;
    box-sizing: border-box;
}
.log-toolbar{
    display:flex;
    gap:10px;
    justify-content:center;
    padding:12px;
    position: sticky;
    top:0;
    background:#f5f5f5;
    z-index:5;
}
.log-toolbar button{
    flex:1;
    max-width:200px;
    border:none;
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
    color:#fff;
    cursor:pointer;
}
#logDeleteAllBtn{background:#c0392b;}
#logExportBtn{background:#1d9bf0;}

.log-storage{
    margin:0 12px 10px;
    padding:10px 12px;
    background:#fff;
    border-radius:8px;
    font-size:12px;
    line-height:1.7;
    color:#555;
    word-break:break-all;
}
.log-storage b{color:#1d9bf0;font-size:14px;}
.log-storage .ls-sub{color:#888;}
.log-storage .ls-ok{color:#888;}
.log-storage .ls-amber{color:#b7791f;}
.log-storage .ls-warn{color:#c0392b;}

.log-list{margin:0 12px 12px;}
.log-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-bottom:1px solid #eee;
    padding:14px 10px;
    cursor:pointer;
}
.log-item:active{background:#f0f0f0;}
.log-idx{
    width:26px;
    height:26px;
    flex-shrink:0;
    border-radius:50%;
    background:#eef3f8;
    color:#1d9bf0;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.log-meta{flex:1;min-width:0;}
.log-date{font-size:15px;font-weight:600;color:#111;}
.log-summary{font-size:13px;color:#888;margin-top:2px;}
.log-arrow{color:#bbb;font-size:22px;flex-shrink:0;}

.log-detail-box{max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
.log-detail-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
}
.log-close{
    border:none;background:transparent;color:#999;
    font-size:24px;line-height:1;cursor:pointer;padding:0 4px;
}
.log-detail-sec-title{
    font-size:14px;font-weight:600;color:#222;
    margin:14px 0 6px;padding-left:8px;border-left:3px solid #1d9bf0;
}
.log-detail-list{background:#fafafa;border-radius:8px;padding:6px 8px;}
.log-detail-row{
    display:flex;gap:8px;padding:8px 4px;border-bottom:1px solid #eee;
}
.log-detail-row:last-child{border-bottom:none;}
.ld-idx{
    width:22px;height:22px;flex-shrink:0;border-radius:50%;
    background:#eef3f8;color:#1d9bf0;font-size:12px;
    display:flex;align-items:center;justify-content:center;
}
.ld-body{flex:1;min-width:0;}
.ld-time{font-size:13px;color:#444;font-weight:600;}
.ld-stats{font-size:12px;color:#888;margin-top:2px;}
.ld-msg{font-size:13px;color:#c0392b;margin-top:2px;word-break:break-all;}
.log-empty{color:#999;font-size:13px;padding:8px 4px;}
.log-detail-actions{display:flex;gap:10px;margin-top:16px;}
.log-act-btn{
    flex:1;border:none;padding:10px;border-radius:8px;font-size:14px;
    background:#1d9bf0;color:#fff;cursor:pointer;
}
.log-act-btn.log-del{background:#c0392b;}
</style>

</head>
<body>
<header id="mainHeader">
<div class="title-wrap">
  <h1 id="pageTitle">RSS媒体阅读器</h1>
  <span class="beta-tag">5.0</span>
</div>
</header>

<div class="main-wrap">
    <div class="page-home" id="pageHome" style="display: block;">
        <div id="articleBox"><div class="empty-tip">暂无文章内容</div></div>
    </div>
    <div class="page-single" id="pageSingle" style="display: none;">
        <div id="articleBoxSingle"><div class="empty-tip">暂无文章内容</div></div>
    </div>
    <div class="page-manage" id="pageManage" style="display: none;">
        <div class="feed-top-op">
    <button id="importFeed">一键导入</button>
    <button id="exportAllBtn">一键导出</button>
    <button id="delAllFeed">一键清空</button>
    <input type="file" id="importFileInput" accept=".json" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;">
</div>
        <div class="feed-list" id="feedPanel"></div>
    </div>
    <div class="page-add" id="pageAdd" style="display: none;">
        <div class="add-feed-form">
            <div class="keyword-block-title">添加新订阅</div>
            <div class="add-feed-row">
                <input id="feedUrl" placeholder="粘贴标准RSS订阅链接">
            </div>
            <div class="add-feed-row">
                <input id="feedName" placeholder="自定义订阅名称" style="flex:1;">
                <button id="confirmAdd">添加</button>
            </div>
        </div>
        <div class="twitter-block-section">
            <div class="keyword-block-title">添加 Twitter 订阅</div>
            <div class="add-feed-row">
                <input id="twitterUserInput" placeholder="输入 Twitter 用户名">
                <button id="confirmAddTwitter">添加</button>
            </div>
        </div>
        <div class="keyword-block-section">
            <div class="keyword-block-title">关键字屏蔽</div>
            <div class="add-feed-row">
                <input id="blockKeywordInput" placeholder="输入要屏蔽的关键字">
                <button id="addKeywordBtn">添加</button>
            </div>
            <div class="keyword-list" id="keywordList"><div style="color:#999;font-size:13px;padding:8px 4px;">暂无屏蔽关键字</div></div>
        </div>
    </div>
    <div class="page-fav" id="pageFav" style="display: none;"><div id="favPanel"></div></div>
    <div class="page-search" id="pageSearch" style="display: none;">
        <div style="padding:12px;">
            <input id="searchInput" placeholder="输入关键词精确匹配标题" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;font-size:16px;">
            <div id="searchResultBox"></div>
        </div>
    </div>
    <div class="page-log" id="pageLog" style="display: none;">
        <div class="log-toolbar">
            <button id="logDeleteAllBtn">一键删除全部报告</button>
            <button id="logExportBtn">一键导出报告</button>
        </div>
        <div class="log-storage" id="logStorage"></div>
        <div class="log-list" id="logList"><div class="empty-tip">暂无日志报告</div></div>
    </div>
</div>

<div class="bottom-nav-bar">
    <button id="btnHome" class="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </button>
    <button id="btnSearch" class="">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
        </svg>
    </button>
    <button id="btnAdd" class="">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"></path>
        </svg>
    </button>
    <button id="btnManage" class="">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" x2="21" y1="6" y2="6"></line>
            <line x1="8" x2="21" y1="12" y2="12"></line>
            <line x1="8" x2="21" y1="18" y2="18"></line>
            <line x1="3" x2="3.01" y1="6" y2="6"></line>
            <line x1="3" x2="3.01" y1="12" y2="12"></line>
            <line x1="3" x2="3.01" y1="18" y2="18"></line>
        </svg>
    </button>
    <button id="btnFav" class="">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>
    <button id="btnLog" class="">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="16" y2="17"></line>
            <line x1="8" y1="9" x2="10" y2="9"></line>
        </svg>
    </button>
</div>

<div class="modal-mask" id="editModal">
    <div class="modal-box">
        <h3>编辑订阅源</h3>
        <input id="editIndex" type="hidden">
        <input id="editName" placeholder="自定义订阅名称">
        <input id="editUrl" placeholder="RSS订阅链接">
        <div class="modal-btn-bar">
            <button id="cancelEdit">取消</button>
            <button id="saveEdit">保存修改</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="clearModal">
    <div class="modal-box">
        <h3>一键清空</h3>
        <div class="clear-options">
            <label><input type="checkbox" id="clearFeeds" checked=""> 清除所有订阅源</label>
            <label><input type="checkbox" id="clearArticles" checked=""> 清除主页所有内容</label>
            <label><input type="checkbox" id="clearFav" checked=""> 清除收藏所有内容</label>
            <label><input type="checkbox" id="clearKeywords" checked=""> 清除关键字屏蔽记录</label>
        </div>
        <div class="modal-btn-bar">
            <button id="cancelClear">取消</button>
            <button id="confirmClear">确认清除</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="exportModal">
    <div class="modal-box">
        <h3>导出数据</h3>
        <div class="clear-options">
            <label><input type="checkbox" id="exportFeeds" checked=""> 所有订阅源列表</label>
            <label><input type="checkbox" id="exportFav" checked=""> 收藏记录数据</label>
            <label><input type="checkbox" id="exportKeywords" checked=""> 关键字屏蔽</label>
        </div>
        <div class="modal-btn-bar">
            <button id="cancelExport">取消</button>
            <button id="confirmExport">确认导出</button>
        </div>
    </div>
</div>

<div class="img-preview-mask" id="imgPreviewMask">
    <button class="preview-close" id="previewClose">×</button>
    <div class="preview-wrap" id="previewWrap"></div>
    <div class="preview-tip" id="previewTip"></div>
</div>
<div class="tip-toast" id="slideTip"></div>

<script src="js/core.js"></script>
<script src="js/media.js"></script>
<script src="js/feed.js"></script>
<script src="js/app.js"></script>
<script src="js/log.js"></script>
